# Firebase App Hosting configuration for Next.js
# https://firebase.google.com/docs/app-hosting
# Updated: 2026-01-09 - Secrets access granted

runConfig:
  runtime: nodejs20
  env:
    - variable: NODE_ENV
      value: production
    # Secrets are loaded from Google Cloud Secret Manager
    - variable: FIREBASE_PROJECT_ID
      secret: FIREBASE_PROJECT_ID
    - variable: FIREBASE_CLIENT_EMAIL
      secret: FIREBASE_CLIENT_EMAIL
    - variable: FIREBASE_PRIVATE_KEY
      secret: FIREBASE_PRIVATE_KEY
    - variable: ADMIN_SESSION_SECRET
      secret: ADMIN_SESSION_SECRET

buildConfig:
  buildCommand: npm ci && npm run build
  outputDirectory: .next

